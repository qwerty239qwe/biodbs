# CI workflow using uv and pyproject.toml for dependency management
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip install pytest-cov
          uv pip install -e .

      - name: Lint with ruff
        run: uv run ruff check . --select=E9,F63,F7,F82 --output-format=github

      - name: Run unit tests
        run: uv run pytest -m "not integration" -v --tb=short --cov=biodbs --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: biomart
            target: tests/test_fetch/biomart
          - service: enrichr
            target: tests/test_fetch/enrichr tests/test_analysis/test_ora.py::TestORAEnrichr
          - service: ensembl
            target: tests/test_fetch/ensembl
          - service: hpa
            target: tests/test_fetch/hpa
          - service: kegg
            target: tests/test_fetch/kegg tests/test_analysis/test_ora.py::TestORAKegg tests/test_translate/test_genes.py::TestTranslateGeneIdsKegg tests/test_translate/test_chem.py::TestTranslateChemicalIdsKegg
          - service: pubchem
            target: tests/test_fetch/pubchem tests/test_translate/test_chem.py::TestTranslateChemicalIds tests/test_translate/test_chem.py::TestTranslateChemicalIdsMultipleTargets tests/test_translate/test_chem.py::TestTranslatePubchemToChembl
          - service: quickgo
            target: tests/test_fetch/quickgo tests/test_analysis/test_ora.py::TestORAGo
          - service: reactome
            target: tests/test_fetch/reactome tests/test_analysis/test_ora.py::TestORAReactome tests/test_analysis/test_ora.py::TestORAReactomeLocal
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --dev --extra graph
          uv pip install -e .

      - name: Run ${{ matrix.service }} integration tests
        # Live third-party APIs (notably PubChem) throttle CI IP ranges; rerun
        # only the failed tests, spaced out, so transient throttling doesn't fail
        # the job without adding request load.
        run: uv run pytest -m integration -v --tb=short --reruns 3 --reruns-delay 15 ${{ matrix.target }}
